<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Phạm Đăng Khôi — Software Engineer · Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8250df" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#d0d7de"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#6e7781">
    <text x="64" y="70">~/dangkhoipham80</text>
  </g>
  <text x="62" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#1f2328">Phạm Đăng Khôi</text>
  <rect x="64" y="172" width="56" height="4" rx="2" fill="url(#bar)"/>
  <text x="64" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#424a53">Software Engineer · Full-Stack Developer</text>
  <text x="64" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#0969da">Java · Spring Boot · Python · FastAPI</text>
  <text x="1136" y="252" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#6e7781">FPT Software · Ho Chi Minh City</text>
</svg>
