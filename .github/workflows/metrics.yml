name: Metrics

# Thay thế WakaTime: lấy dữ liệu từ hoạt động GitHub (commit, PR, issue)
# nên đúng trên mọi máy — Windows, Mac mini, hay SSH từ iPhone.
# Cần secret METRICS_TOKEN: personal access token (classic) với scope repo, read:user.

on:
  schedule:
    - cron: "0 17 * * *" # 00:00 giờ Việt Nam
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Ho_Chi_Minh

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile, tex, jupyter notebook

      - name: Lines of code
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/lines.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30
